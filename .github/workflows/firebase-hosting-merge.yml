name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  verificar:
    uses: ./.github/workflows/verificacion.yml
  build_and_deploy:
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Credenciales para reglas e índices (solo al integrar en main)
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TECHFIX_TRACKER_9A128 }}'
      - name: Publicar reglas e índices antes del nuevo cliente
        run: npx firebase deploy --only firestore:rules,firestore:indexes --project techfix-tracker-9a128 --non-interactive
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TECHFIX_TRACKER_9A128 }}
          channelId: live
          projectId: techfix-tracker-9a128
