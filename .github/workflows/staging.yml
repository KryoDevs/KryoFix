name: Staging cloud pausado (sin facturación)
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Publicar SOLO en el proyecto de staging ya configurado'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: kryofix-staging
  cancel-in-progress: false
jobs:
  verificar:
    # El propietario eligió seguir sin facturación. Reactivar solo tras nueva autorización.
    if: ${{ false }}
    uses: ./.github/workflows/verificacion.yml
  desplegar:
    needs: verificar
    runs-on: ubuntu-latest
    environment: staging
    env:
      ENTORNO_STAGING: 'true'
      FIREBASE_PROJECT_ID: ${{ vars.KRYOFIX_STAGING_PROJECT_ID }}
      FIREBASE_WEB_CONFIG: ${{ vars.KRYOFIX_STAGING_WEB_CONFIG }}
      STORAGE_BUCKET_PRIVADO: ${{ vars.KRYOFIX_STAGING_STORAGE_BUCKET }}
      HABILITAR_ENVIOS: 'false'
      PROVEEDOR_URL: ''
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - name: Validar destinos antes de usar credenciales
        run: |
          node tools/configurar-backend.mjs
          node tools/configurar-entorno.mjs
      - name: Rechazar cuentas ajenas o productivas sin revelar el secreto
        env:
          FIREBASE_SERVICE_ACCOUNT_STAGING: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
        run: node tools/verificar-cuenta-staging.mjs
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}'
      - name: Desplegar exclusivamente staging
        run: >-
          npx firebase deploy --project "$FIREBASE_PROJECT_ID"
          --only firestore:rules,firestore:indexes,storage,functions:kryofix,hosting
          --non-interactive
      - name: Verificar que la API rechaza peticiones sin sesión
        run: |
          status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' \
            -X POST "https://${FIREBASE_PROJECT_ID}.web.app/api/capacidades" \
            -H 'Content-Type: application/json' --data '{}')
          test "$status" = '401' || { echo '::error::La API de staging no respondió 401 sin sesión'; exit 1; }
      - name: Indicar sitio de pruebas
        run: |
          echo "Staging: https://${FIREBASE_PROJECT_ID}.web.app" >> "$GITHUB_STEP_SUMMARY"
          echo 'Mensajes automáticos desactivados. Validar con datos ficticios; no importar producción.' >> "$GITHUB_STEP_SUMMARY"
