name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  verificar:
    uses: ./.github/workflows/verificacion.yml
  build_and_preview:
    needs: verificar
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && vars.KRYOFIX_BACKEND_READY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TECHFIX_TRACKER_9A128 }}
          projectId: techfix-tracker-9a128
