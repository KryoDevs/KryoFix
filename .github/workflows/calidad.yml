name: Calidad (lint + auditoria + tests)

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 20.19 es el minimo que pide jsdom; 22 es la LTS actual.
        node-version: ['20.19', '22']

    name: Node ${{ matrix.node-version }}

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Instalar dependencias de desarrollo
        run: npm ci

      # Un unico comando para que el CI y el desarrollador ejecuten exactamente
      # lo mismo: eslint + auditoria estatica + tests (67).
      - name: Verificacion completa
        run: npm run check

  integracion:
    uses: ./.github/workflows/verificacion.yml
