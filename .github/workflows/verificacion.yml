name: Verificación completa reutilizable
on:
  workflow_call:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run check
      - name: Seguridad y transacciones con emulador (nunca producción)
        run: npm run test:rules
      - run: npx playwright install --with-deps chromium
      - name: Flujos en navegador y móvil
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: errores-verificacion
          path: |
            test-results/
            firestore-debug.log
          retention-days: 7
